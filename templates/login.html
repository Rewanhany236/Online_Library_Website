{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Online Library - Login</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="nav-right">
        <a href="{% url 'book_list' %}" class="logo-container">
            <img src="{% static 'images/read.png' %}" alt="library logo">
            <span style="color: beige;">Kitab Hub</span>
        </a>
    </div>
    <div class="nav-left">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="#">Sign Up</a>
    </div>
</nav>

<center>
    <h1>Login to your account</h1>

    <div class="library-form-container">

        {% if form.errors %}
            <p style="color:red; text-align:center;">
                Incorrect username or password. Please try again.
            </p>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            <input type="submit" class="btn" value="Login">
        </form>

        <p style="margin-top:15px; font-size:0.9rem; color:#5d4037;">
            Don't have an account? <a href="#" style="color:#6E4F3E; font-weight:600;">Sign Up</a>
        </p>

    </div>
</center>

</body>
</html>
