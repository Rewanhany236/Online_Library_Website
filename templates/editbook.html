<!DOCTYPE html>
<html>
<head>
    <title>Edit Book - Kitab Hub</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="nav-right">
        <a href="{% url 'book_list' %}" class="logo-container">
            <img src="{% static 'images/read.png' %}" alt="library logo">
            <span style="color: beige;">Kitab Hub</span>
        </a>
    </div>

    <div class="nav-search">
        <input type="text" id="searchInput" placeholder="Search for a book or author">
        <button type="button" id="searchBtn">🔍</button>
    </div>

    <div class="nav-left">
        <a href="{% url 'home' %}">Home</a>    
        <a href="{% url 'book_list' %}">Books</a> 
        
        {% if user.is_staff %}
        <span id="admin-links">
            <a href="{% url 'add_book' %}">Add Book</a>
        </span>
        {% endif %}
        
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Profile</a>
            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="background: none; border: none; color: white; cursor: pointer;">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'signup' %}">Sign Up</a>
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>
</nav>

<h1><center>Edit Book</center></h1>
<br>

<div class="library-form-container">
    <form id="edit-book-form" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Book Name:</label> 
            <input type="text" class="form-control" id="book-name" name="title" required><br><br>

            <label>ID:</label>  
            <input type="text" class="form-control" id="ID" name="id" readonly><br><br>

            <label>Author:</label>  
            <input type="text" class="form-control" id="Author" name="author" required><br><br> 

            <label>Category:</label>  
            <input type="text" class="form-control" id="Category" name="category" required><br><br>

            <label>Description:</label>  
            <textarea class="form-control" id="Description" name="description" rows="4" required></textarea><br><br>

            <label>Status:</label>  
            <select class="form-control" id="Status" name="status">
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
                <option value="Reserved">Reserved</option>
            </select><br><br>

            <label>Author Wikipedia URL:</label>  
            <input type="url" class="form-control" id="AuthorWikipedia" name="author_wikipedia"><br><br>

            <label>Current Image:</label><br>
            <div id="current-image-container"></div><br>

            <label>New Image (optional):</label>  
            <input type="file" class="form-control" id="Image" name="image" accept="image/*"><br><br>
        </div>
        <button class="btn" type="submit" id="Done-btn">Update Book</button>   
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
    </form>
</div>

<script src="{% static 'JS/editbook.js' %}"></script>

<script>
    // Search functionality
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    if (searchBtn && searchInput) {
        searchBtn.addEventListener('click', () => {
            window.location.href = "{% url 'book_list' %}?q=" + encodeURIComponent(searchInput.value);
        });
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                window.location.href = "{% url 'book_list' %}?q=" + encodeURIComponent(searchInput.value);
            }
        });
    }
    
    // Cancel button
    const cancelBtn = document.getElementById('cancel-btn');
    if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
            window.location.href = "{% url 'book_list' %}";
        });
    }
</script>

</body>
</html>
